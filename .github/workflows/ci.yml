# The five gates on every push and pull request, plus two checks: the API types are generated
# from the vendored contract, and a production build succeeds.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Dependency audit
        run: npm audit
      - name: API types match the contract
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - name: Production build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com
